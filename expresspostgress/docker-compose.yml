services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
        POSTGRES_USER: user
        POSTGRES_PASSWORD: password
        POSTGRES_DB: negocios_db
    ports:
        - "5432:5432"
    volumes:
        - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  mysql:
    image: mysql:8
    container_name: mysql_db
    restart: always
    environment:
        MYSQL_ROOT_PASSWORD: password
        MYSQL_DATABASE: negocios_db
        MYSQL_USER: user
        MYSQL_PASSWORD: password
    ports:
        - "3306:3306"
    volumes:
        - ./db/usuarios.sql:/docker-entrypoint-initdb.d/usuarios.sql
