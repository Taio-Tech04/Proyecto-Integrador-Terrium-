name: CI — Terrium

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── API Gateway ────────────────────────────────────────────────────────────
  api-gateway:
    name: API Gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api-gateway/package-lock.json
      - run: npm ci
      - run: npm test

  # ── Users Service ──────────────────────────────────────────────────────────
  users:
    name: Users Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/users
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/users/package-lock.json
      - run: npm ci
      - run: npm test

  # ── Listings Service ───────────────────────────────────────────────────────
  listings:
    name: Listings Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/listings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/listings/package-lock.json
      - run: npm ci
      - run: npm test

  # ── Valuations Service ─────────────────────────────────────────────────────
  valuations:
    name: Valuations Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/valuations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/valuations/package-lock.json
      - run: npm ci
      - run: npm test

  # ── Analytics Service ──────────────────────────────────────────────────────
  analytics:
    name: Analytics Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/analytics/package-lock.json
      - run: npm ci
      - run: npm test

  # ── Notifications Service ──────────────────────────────────────────────────
  notifications:
    name: Notifications Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notifications
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/notifications/package-lock.json
      - run: npm ci
      - run: npm test

  # ── Docker Build Validation ────────────────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [api-gateway, users, listings, valuations, analytics, notifications]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API Gateway image
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          push: false
          tags: terrium/api-gateway:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: terrium/frontend:test
      - name: Build Analytics image
        uses: docker/build-push-action@v5
        with:
          context: ./services/analytics
          push: false
          tags: terrium/analytics:test

