name: CD — Build, Push & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/terrium

jobs:
  # ── Publicar imágenes en GitHub Container Registry ─────────────────────────
  push-images:
    name: Build & Push — ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            context: Terrium/api-gateway
            dockerfile: Terrium/api-gateway/Dockerfile
          - name: frontend
            context: Terrium/frontend
            dockerfile: Terrium/frontend/Dockerfile
          - name: users
            context: Terrium/services
            dockerfile: Terrium/services/users/Dockerfile
          - name: listings
            context: Terrium/services
            dockerfile: Terrium/services/listings/Dockerfile
          - name: valuations
            context: Terrium/services
            dockerfile: Terrium/services/valuations/Dockerfile
          - name: analytics
            context: Terrium/services
            dockerfile: Terrium/services/analytics/Dockerfile
          - name: notifications
            context: Terrium/services
            dockerfile: Terrium/services/notifications/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build & push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy al servidor vía SSH ──────────────────────────────────────────────
  # Requiere los siguientes secrets en el repo:
  #   DEPLOY_HOST     — IP o hostname del servidor
  #   DEPLOY_USER     — usuario SSH (ej: ubuntu, deploy)
  #   DEPLOY_SSH_KEY  — clave privada SSH (PEM)
  #   DEPLOY_PATH     — ruta al proyecto en el servidor (ej: /opt/terrium)
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: push-images
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '/opt/terrium' }}

            # Autenticar en GHCR para poder hacer pull
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Bajar las nuevas imágenes
            docker compose pull

            # Re-levantar con nuevas imágenes, sin downtime en los servicios no afectados
            docker compose up -d --remove-orphans --no-build

            # Limpiar imágenes huérfanas para liberar espacio
            docker image prune -f

            echo "Deploy completado — commit ${{ github.sha }}"
