
# ─────────────────────────────────────────────────────────────────────────────
#  TERRIUM — docker-compose
#
#  MODO SUPABASE (producción / staging):
#    Completá el archivo .env con tus credenciales de Supabase y levantá sin
#    el perfil "local":
#      docker compose --env-file .env up
#
#  MODO LOCAL (desarrollo sin internet):
#    Usá el perfil "local" para levantar PostgreSQL en Docker:
#      docker compose --env-file .env --profile local up
# ─────────────────────────────────────────────────────────────────────────────

networks:
  terrium-net:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  rabbitmq_data:

services:
  # ─── BASE DE DATOS LOCAL (solo con --profile local) ──────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: terrium-postgres
    restart: unless-stopped
    profiles: [local]
    environment:
      POSTGRES_USER: terrium
      POSTGRES_PASSWORD: terrium_secret
      POSTGRES_DB: terrium_main
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - terrium-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrium"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: terrium-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - terrium-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: terrium-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: terrium
      RABBITMQ_DEFAULT_PASS: terrium_secret
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - terrium-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── MICROSERVICIOS ───────────────────────────────────────────────────────────
  users:
    build:
      context: ./services
      dockerfile: users/Dockerfile
    container_name: terrium-users
    restart: unless-stopped
    environment:
      DATABASE_URL: ${USERS_DATABASE_URL:-postgresql://terrium:terrium_secret@postgres:5432/terrium_users}
      AMQP_URL: ${AMQP_URL:-amqp://terrium:terrium_secret@rabbitmq:5672}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 3005
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      rabbitmq:
        condition: service_healthy
        required: false
    ports:
      - "3005:3005"
    networks:
      - terrium-net

  listings:
    build:
      context: ./services
      dockerfile: listings/Dockerfile
    container_name: terrium-listings
    restart: unless-stopped
    environment:
      DATABASE_URL: ${LISTINGS_DATABASE_URL:-postgresql://terrium:terrium_secret@postgres:5432/terrium_listings}
      AMQP_URL: ${AMQP_URL:-amqp://terrium:terrium_secret@rabbitmq:5672}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      rabbitmq:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    ports:
      - "3001:3001"
    networks:
      - terrium-net

  valuations:
    build:
      context: ./services
      dockerfile: valuations/Dockerfile
    container_name: terrium-valuations
    restart: unless-stopped
    environment:
      DATABASE_URL: ${VALUATIONS_DATABASE_URL:-postgresql://terrium:terrium_secret@postgres:5432/terrium_valuations}
      AMQP_URL: ${AMQP_URL:-amqp://terrium:terrium_secret@rabbitmq:5672}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PORT: 3002
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      rabbitmq:
        condition: service_healthy
        required: false
    ports:
      - "3002:3002"
    networks:
      - terrium-net

  analytics:
    build:
      context: ./services
      dockerfile: analytics/Dockerfile
    container_name: terrium-analytics
    restart: unless-stopped
    environment:
      DATABASE_URL: ${ANALYTICS_DATABASE_URL:-postgresql://terrium:terrium_secret@postgres:5432/terrium_analytics}
      AMQP_URL: ${AMQP_URL:-amqp://terrium:terrium_secret@rabbitmq:5672}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PORT: 3003
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      rabbitmq:
        condition: service_healthy
        required: false
    ports:
      - "3003:3003"
    networks:
      - terrium-net

  notifications:
    build:
      context: ./services
      dockerfile: notifications/Dockerfile
    container_name: terrium-notifications
    restart: unless-stopped
    environment:
      DATABASE_URL: ${NOTIFICATIONS_DATABASE_URL:-postgresql://terrium:terrium_secret@postgres:5432/terrium_notifications}
      AMQP_URL: ${AMQP_URL:-amqp://terrium:terrium_secret@rabbitmq:5672}
      SMTP_HOST: ${SMTP_HOST:-smtp.mailtrap.io}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@terrium.ar}
      PORT: 3004
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      rabbitmq:
        condition: service_healthy
        required: false
    ports:
      - "3004:3004"
    networks:
      - terrium-net

  # ─── API GATEWAY ─────────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: terrium-gateway
    restart: unless-stopped
    environment:
      LISTINGS_URL: ${LISTINGS_URL:-http://listings:3001}
      VALUATIONS_URL: ${VALUATIONS_URL:-http://valuations:3002}
      ANALYTICS_URL: ${ANALYTICS_URL:-http://analytics:3003}
      NOTIFICATIONS_URL: ${NOTIFICATIONS_URL:-http://notifications:3004}
      USERS_URL: ${USERS_URL:-http://users:3005}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PORT: 4000
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      - users
      - listings
      - valuations
      - analytics
      - notifications
    ports:
      - "4000:4000"
    networks:
      - terrium-net

  # ─── FRONTEND ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: terrium-frontend
    restart: unless-stopped
    depends_on:
      - api-gateway
    ports:
      - "80:80"
    networks:
      - terrium-net

  # ─── HERRAMIENTAS DE ADMIN ────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: terrium-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@terrium.ar
      PGADMIN_DEFAULT_PASSWORD: admin_secret
    ports:
      - "5050:80"
    networks:
      - terrium-net
    profiles:
      - tools

