networks:
  terrium-net:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  rabbitmq_data:
  mongo_data:

services:
  # ─── BASE DE DATOS LOCAL (solo con --profile local) ──────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: terrium-postgres
    restart: unless-stopped
    profiles: [local]
    environment:
      POSTGRES_USER: terrium
      POSTGRES_PASSWORD: terrium_secret
      POSTGRES_DB: terrium_main
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - terrium-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrium"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: terrium-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - terrium-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: terrium-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: terrium
      RABBITMQ_DEFAULT_PASS: terrium_secret
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - terrium-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── BASE DE DATOS NoSQL (MongoDB) ───────────────────────────────────────────
  # Usada por el API Gateway para almacenar favoritos de propiedades.
  # Modelo documental: ideal para listas de favoritos por usuario (sin JOINs).
  mongodb:
    image: mongo:7-jammy
    container_name: terrium-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: terrium
      MONGO_INITDB_ROOT_PASSWORD: terrium_secret
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - terrium-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MICROSERVICIOS ───────────────────────────────────────────────────────────
  users:
    build:
      context: ./services
      dockerfile: users/Dockerfile
    image: ghcr.io/taio-tech04/terrium-users:latest
    container_name: terrium-users
    restart: unless-stopped
    environment:
      DATABASE_URL: ${USERS_DATABASE_URL:-postgresql://terrium:terrium_secret@postgres:5432/terrium_users}
      AMQP_URL: ${AMQP_URL:-amqp://terrium:terrium_secret@rabbitmq:5672}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # Google OAuth 2.0 — configurar en Google Cloud Console
      # https://console.cloud.google.com/apis/credentials
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:4000/api/auth/google/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      PORT: 3005
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      rabbitmq:
        condition: service_healthy
        required: false
    ports:
      - "3005:3005"
    networks:
      - terrium-net

  listings:
    build:
      context: ./services
      dockerfile: listings/Dockerfile
    image: ghcr.io/taio-tech04/terrium-listings:latest
    container_name: terrium-listings
    restart: unless-stopped
    environment:
      DATABASE_URL: ${LISTINGS_DATABASE_URL:-postgresql://terrium:terrium_secret@postgres:5432/terrium_listings}
      AMQP_URL: ${AMQP_URL:-amqp://terrium:terrium_secret@rabbitmq:5672}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      rabbitmq:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    ports:
      - "3001:3001"
    networks:
      - terrium-net

  valuations:
    build:
      context: ./services
      dockerfile: valuations/Dockerfile
    image: ghcr.io/taio-tech04/terrium-valuations:latest
    container_name: terrium-valuations
    restart: unless-stopped
    environment:
      DATABASE_URL: ${VALUATIONS_DATABASE_URL:-postgresql://terrium:terrium_secret@postgres:5432/terrium_valuations}
      AMQP_URL: ${AMQP_URL:-amqp://terrium:terrium_secret@rabbitmq:5672}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PORT: 3002
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      rabbitmq:
        condition: service_healthy
        required: false
    ports:
      - "3002:3002"
    networks:
      - terrium-net

  analytics:
    build:
      context: ./services
      dockerfile: analytics/Dockerfile
    image: ghcr.io/taio-tech04/terrium-analytics:latest
    container_name: terrium-analytics
    restart: unless-stopped
    environment:
      DATABASE_URL: ${ANALYTICS_DATABASE_URL:-postgresql://terrium:terrium_secret@postgres:5432/terrium_analytics}
      AMQP_URL: ${AMQP_URL:-amqp://terrium:terrium_secret@rabbitmq:5672}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PORT: 3003
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      rabbitmq:
        condition: service_healthy
        required: false
    ports:
      - "3003:3003"
    networks:
      - terrium-net

  notifications:
    build:
      context: ./services
      dockerfile: notifications/Dockerfile
    image: ghcr.io/taio-tech04/terrium-notifications:latest
    container_name: terrium-notifications
    restart: unless-stopped
    environment:
      DATABASE_URL: ${NOTIFICATIONS_DATABASE_URL:-postgresql://terrium:terrium_secret@postgres:5432/terrium_notifications}
      AMQP_URL: ${AMQP_URL:-amqp://terrium:terrium_secret@rabbitmq:5672}
      SMTP_HOST: ${SMTP_HOST:-smtp.mailtrap.io}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@terrium.ar}
      PORT: 3004
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      rabbitmq:
        condition: service_healthy
        required: false
    ports:
      - "3004:3004"
    networks:
      - terrium-net

  # ─── API GATEWAY ─────────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    image: ghcr.io/taio-tech04/terrium-api-gateway:latest
    container_name: terrium-gateway
    restart: unless-stopped
    environment:
      LISTINGS_URL: ${LISTINGS_URL:-http://listings:3001}
      VALUATIONS_URL: ${VALUATIONS_URL:-http://valuations:3002}
      ANALYTICS_URL: ${ANALYTICS_URL:-http://analytics:3003}
      NOTIFICATIONS_URL: ${NOTIFICATIONS_URL:-http://notifications:3004}
      USERS_URL: ${USERS_URL:-http://users:3005}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MONGO_URL: ${MONGO_URL:-mongodb://terrium:terrium_secret@mongodb:27017/terrium_favorites?authSource=admin}
      PORT: 4000
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      - users
      - listings
      - valuations
      - analytics
      - notifications
      - mongodb
    ports:
      - "4000:4000"
    networks:
      - terrium-net

  # ─── FRONTEND ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/taio-tech04/terrium-frontend:latest
    container_name: terrium-frontend
    restart: unless-stopped
    depends_on:
      - api-gateway
    ports:
      - "80:80"
    networks:
      - terrium-net

  # ─── HERRAMIENTAS DE ADMIN ────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: terrium-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@terrium.ar
      PGADMIN_DEFAULT_PASSWORD: admin_secret
    ports:
      - "5050:80"
    networks:
      - terrium-net
    profiles:
      - tools

