name: terrium

networks:
  terrium-net:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  rabbitmq_data:
  mongo_data:

services:
  # Infraestructura local
  postgres:
    image: postgres:16-alpine
    container_name: terrium-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terrium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terrium_secret}
      POSTGRES_DB: ${POSTGRES_DB:-terrium_main}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - terrium-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-terrium} -d ${POSTGRES_DB:-terrium_main}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: terrium-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - terrium-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: terrium-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-terrium}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-terrium_secret}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    networks:
      - terrium-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  mongodb:
    image: mongo:7-jammy
    container_name: terrium-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-terrium}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-terrium_secret}
    volumes:
      - mongo_data:/data/db
    ports:
      - "${MONGO_PORT:-27017}:27017"
    networks:
      - terrium-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Microservicios
  users:
    build:
      context: ./services
      dockerfile: users/Dockerfile
    image: ghcr.io/taio-tech04/terrium-users:${TERRIUM_IMAGE_TAG:-latest}
    container_name: terrium-users
    restart: unless-stopped
    environment:
      DATABASE_URL: ${USERS_DATABASE_URL:-postgresql://terrium:terrium_secret@postgres:5432/terrium_users}
      AMQP_URL: ${AMQP_URL:-amqp://terrium:terrium_secret@rabbitmq:5672}
      JWT_SECRET: ${JWT_SECRET:-change_me_min_32_chars_for_development}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:4000/api/auth/google/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      PORT: 3005
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${USERS_PORT:-3005}:3005"
    networks:
      - terrium-net
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://localhost:3005/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  listings:
    build:
      context: ./services
      dockerfile: listings/Dockerfile
    image: ghcr.io/taio-tech04/terrium-listings:${TERRIUM_IMAGE_TAG:-latest}
    container_name: terrium-listings
    restart: unless-stopped
    environment:
      DATABASE_URL: ${LISTINGS_DATABASE_URL:-postgresql://terrium:terrium_secret@postgres:5432/terrium_listings}
      AMQP_URL: ${AMQP_URL:-amqp://terrium:terrium_secret@rabbitmq:5672}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${LISTINGS_PORT:-3001}:3001"
    networks:
      - terrium-net
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://localhost:3001/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  valuations:
    build:
      context: ./services
      dockerfile: valuations/Dockerfile
    image: ghcr.io/taio-tech04/terrium-valuations:${TERRIUM_IMAGE_TAG:-latest}
    container_name: terrium-valuations
    restart: unless-stopped
    environment:
      DATABASE_URL: ${VALUATIONS_DATABASE_URL:-postgresql://terrium:terrium_secret@postgres:5432/terrium_valuations}
      AMQP_URL: ${AMQP_URL:-amqp://terrium:terrium_secret@rabbitmq:5672}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PORT: 3002
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${VALUATIONS_PORT:-3002}:3002"
    networks:
      - terrium-net
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://localhost:3002/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  analytics:
    build:
      context: ./services
      dockerfile: analytics/Dockerfile
    image: ghcr.io/taio-tech04/terrium-analytics:${TERRIUM_IMAGE_TAG:-latest}
    container_name: terrium-analytics
    restart: unless-stopped
    environment:
      DATABASE_URL: ${ANALYTICS_DATABASE_URL:-postgresql://terrium:terrium_secret@postgres:5432/terrium_analytics}
      AMQP_URL: ${AMQP_URL:-amqp://terrium:terrium_secret@rabbitmq:5672}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PORT: 3003
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${ANALYTICS_PORT:-3003}:3003"
    networks:
      - terrium-net
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://localhost:3003/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  notifications:
    build:
      context: ./services
      dockerfile: notifications/Dockerfile
    image: ghcr.io/taio-tech04/terrium-notifications:${TERRIUM_IMAGE_TAG:-latest}
    container_name: terrium-notifications
    restart: unless-stopped
    environment:
      DATABASE_URL: ${NOTIFICATIONS_DATABASE_URL:-postgresql://terrium:terrium_secret@postgres:5432/terrium_notifications}
      AMQP_URL: ${AMQP_URL:-amqp://terrium:terrium_secret@rabbitmq:5672}
      SMTP_HOST: ${SMTP_HOST:-smtp.mailtrap.io}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@terrium.ar}
      PORT: 3004
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${NOTIFICATIONS_PORT:-3004}:3004"
    networks:
      - terrium-net
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://localhost:3004/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    image: ghcr.io/taio-tech04/terrium-api-gateway:${TERRIUM_IMAGE_TAG:-latest}
    container_name: terrium-gateway
    restart: unless-stopped
    environment:
      LISTINGS_URL: ${LISTINGS_URL:-http://listings:3001}
      VALUATIONS_URL: ${VALUATIONS_URL:-http://valuations:3002}
      ANALYTICS_URL: ${ANALYTICS_URL:-http://analytics:3003}
      NOTIFICATIONS_URL: ${NOTIFICATIONS_URL:-http://notifications:3004}
      USERS_URL: ${USERS_URL:-http://users:3005}
      JWT_SECRET: ${JWT_SECRET:-change_me_min_32_chars_for_development}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MONGO_URL: ${MONGO_URL:-mongodb://terrium:terrium_secret@mongodb:27017/terrium_favorites?authSource=admin}
      PORT: 4000
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      users:
        condition: service_healthy
      listings:
        condition: service_healthy
      valuations:
        condition: service_healthy
      analytics:
        condition: service_healthy
      notifications:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-4000}:4000"
    networks:
      - terrium-net
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://localhost:4000/health\").then(r=>process.exit(r.status < 400 ? 0 : 1)).catch(()=>process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/taio-tech04/terrium-frontend:${TERRIUM_IMAGE_TAG:-latest}
    container_name: terrium-frontend
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - terrium-net

  # Herramientas de administracion
  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: terrium-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@terrium.ar}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin_secret}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - terrium-net
    profiles:
      - tools
